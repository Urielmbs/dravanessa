name: Deploy Institucional HostGator (SSH/Rsync)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy Website to HostGator
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Baixar código fonte do repositório
        uses: actions/checkout@v4

      - name: ⚙️ 2. Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 3. Instalar dependências
        run: npm ci

      - name: 🏗️ 4. Compilar site Astro (Gera HTML/CSS em ./dist/)
        run: npm run build

      - name: 📂 5. Sincronizar pasta ./dist/ com a HostGator via Rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTGATOR_SSH_KEY || secrets.HOSTGATOR_PASSWORD || secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTGATOR_HOST }}
          REMOTE_USER: ${{ secrets.HOSTGATOR_USER }}
          REMOTE_PORT: "2222"
          SOURCE: "dist/"
          TARGET: "./public_html/dravanessazsilveira.com.br/"
          EXCLUDE: "/.git*, /blog/*"
          ARGS: "-avzr --delete"
          SSH_CMD_ARGS: "-T -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
