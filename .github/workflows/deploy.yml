name: CI (Build Verification)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    name: 🏗️ Verificar Build Astro
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Baixar código fonte do repositório
        uses: actions/checkout@v6

      - name: ⚙️ 2. Configurar ambiente Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 3. Instalar dependências
        run: npm ci

      - name: 🏗️ 4. Testar compilação Astro
        run: npm run build

