name: Deploy Institucional HostGator (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🚀 Deploy Website to HostGator
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 1. Baixar código fonte do repositório
        uses: actions/checkout@v6

      - name: ⚙️ 2. Configurar ambiente Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 3. Instalar dependências
        run: npm ci

      - name: 🏗️ 4. Compilar site Astro (Gera HTML/CSS em ./dist/)
        run: npm run build

      - name: 📂 5. Enviar pasta ./dist/ para a HostGator via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTGATOR_HOST }}
          username: ${{ secrets.HOSTGATOR_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          port: 2222
          protocol: sftp
          local-dir: ./dist/
          server-dir: ./dravanessazsilveira.com.br/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/blog/**
